{% extends 'base.html' %}
{% block title %}Blog Posts{% endblock %}

{% block content %}
<h2 class="mb-4">Latest Blog Posts</h2>
<div class="row">
    {% for blog in blogs %}
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm">
                {% if blog.image_url %}
                    <img src="{{ blog.image_url }}" class="card-img-top" alt="Blog image">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ blog.title }}</h5>
                    <p class="card-text">{{ blog.content|truncatewords:20 }}</p>
                    <a href="{% url 'blog_detail' blog.pk %}" class="btn btn-outline-primary btn-sm">Read More</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
