{% extends "base.html" %}
{% block title %}CardioCheck | Hospital Locator{% endblock %}

{% block content %}
<div class="my-4">
    <h2 class="text-center">Find a Nearby Hospital</h2>
    <p class="text-center text-muted">Use the map below to locate the closest specialist healthcare facilities.</p>

    <div id="map" style="height: 500px;" class="rounded shadow"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function initMap() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                const map = new google.maps.Map(document.getElementById('map'), {
                    center: userLocation,
                    zoom: 13
                });

                const marker = new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    title: "Your Location"
                });

                const request = {
                    location: userLocation,
                    radius: '5000',
                    type: ['hospital']
                };

                const service = new google.maps.places.PlacesService(map);
                service.nearbySearch(request, (results, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        for (let i = 0; i < results.length; i++) {
                            new google.maps.Marker({
                                position: results[i].geometry.location,
                                map: map,
                                title: results[i].name
                            });
                        }
                    }
                });
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    }
</script>
<script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDK4XKqz-H8PS4szBVxxLpFgNXp6xryspE&libraries=places&callback=initMap">
</script>
{% endblock %}
