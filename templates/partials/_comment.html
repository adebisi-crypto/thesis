<div class="mb-3 ps-3 border-start">
    <p class="mb-1">
        <strong>{{ comment.user.username }}</strong>
        <small class="text-muted">{{ comment.created_at|timesince }} ago</small>
    </p>
    <p>{{ comment.content }}</p>

    <div class="d-flex gap-2">
        <form method="post" action="{% url 'upvote_comment' comment.id %}">
            {% csrf_token %}
            <button class="btn btn-outline-success btn-sm" type="submit">👍 {{ comment.votes.filter(vote_type='up').count }}</button>
        </form>
        <form method="post" action="{% url 'downvote_comment' comment.id %}">
            {% csrf_token %}
            <button class="btn btn-outline-danger btn-sm" type="submit">👎 {{ comment.votes.filter(vote_type='down').count }}</button>
        </form>
        {% if user.is_authenticated %}
            <a href="#" class="btn btn-outline-secondary btn-sm reply-btn" data-parent="{{ comment.id }}">↩ Reply</a>
        {% endif %}
    </div>

    <!-- Nested Replies -->
    {% for reply in comment.replies.all %}
        {% include "blogs/partials/_comment.html" with comment=reply %}
    {% endfor %}
</div>
